<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>BEN, and his Chinese knees</title>
<style>
html,body{margin:0;width:100%;height:100%;background:#111;display:flex;align-items:center;justify-content:center;overflow:hidden;touch-action:none;font-family:system-ui,Arial,sans-serif}
#wrap{position:relative;width:min(100vw,1200px);aspect-ratio:16/9}
canvas{display:block;width:100%;height:100%;border-radius:10px;background:#121821;image-rendering:auto}
#hint{position:absolute;left:12px;top:10px;color:#fff;pointer-events:none;text-shadow:2px 2px 0 #000;font-size:13px;font-weight:700}
#touch{position:absolute;left:0;right:0;bottom:14px;display:flex;justify-content:space-between;align-items:end;padding:0 14px;pointer-events:none}
.group{display:flex;gap:10px;pointer-events:auto}
.touchbtn{min-width:64px;height:60px;border:1px solid #fff8;border-radius:15px;background:#000b;color:#fff;font-weight:900;font-size:18px;touch-action:none;-webkit-user-select:none;user-select:none}
.touchbtn:active{transform:scale(.96);background:#2a3d55}
#knee{background:#8f2c2cdd}
#jump{background:#235789dd}
@media (min-width:700px){.touchbtn{min-width:74px;height:64px}}
</style>
</head>
<body>
<div id="wrap">
<canvas id="game" width="960" height="540" aria-label="Chinese Knees game"></canvas>
<div id="hint">BEN • MOVE • CLIMB • FIRE KNEES</div>
<div id="touch">
  <div class="group">
    <button class="touchbtn" id="left">◀</button>
    <button class="touchbtn" id="right">▶</button>
  </div>
  <div class="group">
    <button class="touchbtn" id="jump">JUMP</button>
    <button class="touchbtn" id="knee">KNEE!</button>
  </div>
</div>
</div>

<script>
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d');
const W=960,H=540;
const keys={};

function bindHold(id,key){
  const el=document.getElementById(id);
  const on=e=>{e.preventDefault(); keys[key]=true};
  const off=e=>{e.preventDefault(); keys[key]=false};
  el.addEventListener('pointerdown',on,{passive:false});
  ['pointerup','pointercancel','pointerleave'].forEach(t=>el.addEventListener(t,off,{passive:false}));
}
bindHold('left','left'); bindHold('right','right'); bindHold('jump','jump'); bindHold('knee','knee');

addEventListener('keydown',e=>{
  const k=e.key.toLowerCase();
  if(k==='arrowleft'||k==='a') keys.left=true;
  if(k==='arrowright'||k==='d') keys.right=true;
  if(k==='arrowup'||k==='w'||k===' ') keys.jump=true;
  if(k==='arrowdown'||k==='s') keys.down=true;
  if(k==='z') keys.knee=true;
  if(k==='r') reset();
  if(['arrowleft','arrowright','arrowup','w','a','d','z',' '].includes(k)) e.preventDefault();
});
addEventListener('keyup',e=>{
  const k=e.key.toLowerCase();
  if(k==='arrowleft'||k==='a') keys.left=false;
  if(k==='arrowright'||k==='d') keys.right=false;
  if(k==='arrowup'||k==='w'||k===' ') keys.jump=false;
  if(k==='arrowdown'||k==='s') keys.down=false;
  if(k==='z') keys.knee=false;
});

const platforms=[
  {x:-30,y:500,w:1020,h:60,kind:'street'},
  {x:15,y:425,w:190,h:18,kind:'awning'},
  {x:245,y:365,w:175,h:18,kind:'roof'},
  {x:470,y:300,w:190,h:18,kind:'roof'},
  {x:700,y:240,w:220,h:18,kind:'roof'},
  {x:560,y:170,w:170,h:18,kind:'roof'},
  {x:310,y:115,w:185,h:18,kind:'roof'},
  {x:65,y:55,w:170,h:18,kind:'roof'}
];

const ladders=[
  {x:165,y:425,w:26,h:75,topY:425,bottomY:500},
  {x:335,y:365,w:26,h:65,topY:365,bottomY:430},
  {x:600,y:300,w:26,h:70,topY:300,bottomY:370},
  {x:785,y:240,w:26,h:80,topY:240,bottomY:320},
  {x:650,y:170,w:26,h:75,topY:170,bottomY:245},
  {x:390,y:115,w:26,h:85,topY:115,bottomY:200},
  {x:130,y:55,w:26,h:80,topY:55,bottomY:135}
];

const stalls=[
  {x:25,y:444,w:135,h:56,title:'TEA & SPICE'},
  {x:430,y:324,w:140,h:56,title:'DUMPLINGS'},
  {x:680,y:264,w:160,h:56,title:'FRESH MARKET'},
  {x:270,y:389,w:125,h:56,title:'NOODLES'}
];

let player,enemies,shots,particles,score,lives,state,camX,camY,spawn;

function reset(){
  player={x:82,y:458,w:28,h:42,vx:0,vy:0,onGround:false,climbing:false,face:1,cool:0,inv:0};
  enemies=[];
  shots=[];
  particles=[];
  score=0;
  lives=3;
  state='play';
  camX=0; camY=0; spawn=0;
  [
    [120,466],[285,331],[520,266],[760,206],[595,136],[345,81],[98,21]
  ].forEach(([x,y],i)=>enemies.push({x,y,w:30,h:42,vx:(i%2?-.55:.65),vy:0,alive:true,seed:i}));
}

function spawnEnemy(){
  const pool=[
    {x:900,y:198},{x:835,y:198},{x:675,y:258},{x:510,y:258},{x:380,y:323},{x:200,y:383}
  ];
  const s=pool[Math.floor(Math.random()*pool.length)];
  enemies.push({x:s.x,y:s.y,w:30,h:42,vx:Math.random()<.5?-0.8:0.8,vy:0,alive:true,seed:Math.random()*100});
}

function hit(a,b){
  return a.x<b.x+b.w && a.x+a.w>b.x && a.y<b.y+b.h && a.y+a.h>b.y;
}

function nearestLadder(){
  for(const l of ladders){
    const cx=player.x+player.w/2;
    if(Math.abs(cx-(l.x+l.w/2))<28 && player.y+player.h>=l.topY-10 && player.y<=l.bottomY+10) return l;
  }
  return null;
}

function fireKnee(){
  if(player.cool>0 || state!=='play') return;
  player.cool=18;
  shots.push({
    x:player.x+(player.face>0?player.w:0),
    y:player.y+18,
    vx:player.face*8.5,
    vy:-0.4,
    rot:0,
    life:90
  });
  for(let i=0;i<4;i++) particles.push({x:player.x+14,y:player.y+20,vx:(Math.random()-.5)*2,vy:-Math.random()*2,life:18,col:'#f6bd7d'});
}

function hurt(){
  if(player.inv>0) return;
  lives--;
  player.inv=90;
  player.x=70; player.y=450; player.vy=-7; player.climbing=false;
  if(lives<=0) state='over';
}

function update(){
  if(state!=='play') return;
  spawn--;
  if(spawn<=0 && enemies.length<9){spawn=140+Math.random()*100;spawnEnemy();}

  const ladder=nearestLadder();
  player.climbing=false;
  if(ladder && (keys.jump || keys.up || keys.w)){
    player.climbing=true;
    player.x += ((ladder.x+ladder.w/2)-(player.x+player.w/2))*0.22;
    player.y -= 2.6;
    player.vy=0;
    if(player.y+player.h<=ladder.topY) {
      player.y=ladder.topY-player.h;
      player.climbing=false;
    }
  } else if(ladder && (keys.down || keys.s)){
    player.climbing=true;
    player.x += ((ladder.x+ladder.w/2)-(player.x+player.w/2))*0.22;
    player.y += 2.6;
    player.vy=0;
    if(player.y+player.h>=ladder.bottomY){
      player.y=ladder.bottomY-player.h;
      player.climbing=false;
    }
  } else {
    if(keys.left){player.vx-=0.65;player.face=-1}
    if(keys.right){player.vx+=0.65;player.face=1}
    if(!keys.left&&!keys.right) player.vx*=0.78;
    player.vx=Math.max(-4.5,Math.min(4.5,player.vx));

    if(keys.jump && player.onGround){
      player.vy=-11.2;
      player.onGround=false;
    }
    player.vy+=0.48;
    player.x+=player.vx;
    player.y+=player.vy;
    player.onGround=false;

    for(const p of platforms){
      if(player.x+player.w>p.x && player.x<p.x+p.w &&
         player.y+player.h>p.y && player.y+player.h-player.vy<=p.y){
        player.y=p.y-player.h;
        player.vy=0;
        player.onGround=true;
      }
    }
  }

  if(keys.knee) fireKnee();
  player.cool=Math.max(0,player.cool-1);
  player.inv=Math.max(0,player.inv);

  if(player.y>H+120) hurt();

  for(const e of enemies){
    e.vy+=0.45;
    e.x+=e.vx;
    e.y+=e.vy;
    for(const p of platforms){
      if(e.x+e.w>p.x && e.x<p.x+p.w && e.y+e.h>p.y && e.y+e.h-e.vy<=p.y){
        e.y=p.y-e.h;
        e.vy=0;
      }
    }
    if(e.x<0||e.x+e.w>W)e.vx*=-1;
    if(Math.sin(performance.now()/600+e.seed)<-0.96)e.vx*=-1;
    if(hit(e,player)) hurt();
  }

  for(const s of shots){
    s.x+=s.vx; s.y+=s.vy; s.vy+=0.02; s.rot+=0.32; s.life--;
    for(const e of enemies){
      if(e.alive && hit(s,e)){
        e.alive=false;
        score+=100;
        for(let i=0;i<12;i++) particles.push({
          x:e.x+15,y:e.y+20,vx:(Math.random()-.5)*5,vy:(Math.random()-0.8)*5,life:28+Math.random()*18,col:i%2?'#d94a44':'#f3c36b'
        });
      }
    }
  }
  shots=shots.filter(s=>s.life>0 && s.x>-50 && s.x<W+50);
  enemies=enemies.filter(e=>e.alive);
  for(const p of particles){p.x+=p.vx;p.y+=p.vy;p.vy+=0.14;p.life--}
  particles=particles.filter(p=>p.life>0);

  // Camera follows the climb.
  camY += ((Math.max(0,Math.min(250,420-player.y)))-camY)*0.08;

  if(score>=1800) state='win';
}

function drawHuman(x,y,scale,shirt,trousers,skin,hair,facing=1){
  ctx.save();
  ctx.translate(x+15,y+42);
  ctx.scale(scale,scale);
  ctx.scale(facing,1);

  // soft shadow
  ctx.fillStyle='rgba(0,0,0,.28)';
  ctx.beginPath();ctx.ellipse(0,3,14,4,0,0,Math.PI*2);ctx.fill();

  // legs
  ctx.fillStyle=trousers;
  ctx.fillRect(-11,-11,9,23);
  ctx.fillRect(2,-11,9,23);
  ctx.fillStyle='#20242a';
  ctx.fillRect(-12,9,10,4);
  ctx.fillRect(2,9,10,4);

  // torso + shoulders
  ctx.fillStyle=shirt;
  ctx.beginPath();
  ctx.roundRect(-13,-34,26,25,5);ctx.fill();

  // arm
  ctx.fillStyle=skin;
  ctx.beginPath();ctx.roundRect(-18,-30,7,20,3);ctx.fill();
  ctx.beginPath();ctx.roundRect(11,-30,7,20,3);ctx.fill();

  // neck
  ctx.fillStyle=skin;ctx.fillRect(-4,-39,8,7);

  // head
  ctx.fillStyle=skin;
  ctx.beginPath();ctx.ellipse(0,-52,13,15,0,0,Math.PI*2);ctx.fill();

  // hair
  ctx.fillStyle=hair;
  ctx.beginPath();
  ctx.arc(0,-57,14,Math.PI,Math.PI*2);
  ctx.fill();
  ctx.fillRect(-12,-57,24,6);

  // eyes
  ctx.fillStyle='#171717';
  ctx.fillRect(-6,-54,3,3);ctx.fillRect(3,-54,3,3);
  // mouth
  ctx.fillStyle='#7b3b3b';
  ctx.fillRect(-3,-46,6,2);

  ctx.restore();
}

function drawMarket(){
  // Sky
  const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#172033');g.addColorStop(1,'#3a2130');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);

  // moon + haze
  ctx.fillStyle='#f5e7b7';ctx.beginPath();ctx.arc(820,72,38,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='rgba(255,220,180,.08)';ctx.fillRect(0,125,W,95);

  // distant apartment blocks
  for(let i=0;i<14;i++){
    const bx=i*75-20, bh=95+(i*37%95);
    ctx.fillStyle=i%2?'#263344':'#222b39';
    ctx.fillRect(bx,500-bh,66,bh);
    for(let r=0;r<4;r++)for(let col=0;col<2;col++){
      ctx.fillStyle=(i+r+col)%3===0?'#efbd68':'#b67d4a';
      ctx.fillRect(bx+12+col*26,490-bh+r*26,10,12);
    }
  }

  // overhead wires
  ctx.strokeStyle='rgba(0,0,0,.65)';ctx.lineWidth=3;
  for(let i=0;i<4;i++){ctx.beginPath();ctx.moveTo(0,50+i*27);ctx.quadraticCurveTo(460,110+i*18,960,50+i*27);ctx.stroke();}

  // hanging lanterns
  for(let i=0;i<10;i++){
    const lx=35+i*98, ly=80+(i%3)*22;
    ctx.fillStyle='#8c2020';ctx.fillRect(lx,ly,5,18);
    ctx.fillStyle='#d5443f';ctx.beginPath();ctx.roundRect(lx-9,ly+18,23,32,7);ctx.fill();
    ctx.fillStyle='#f3c767';ctx.fillRect(lx-4,ly+28,13,3);
  }

  // big market gate / sign
  ctx.fillStyle='#7d1f25';ctx.fillRect(328,26,304,66);
  ctx.fillStyle='#e2b65c';ctx.lineWidth=4;ctx.strokeStyle='#e2b65c';ctx.strokeRect(328,26,304,66);
  ctx.fillStyle='#f9d77a';ctx.font='900 38px Georgia,serif';ctx.textAlign='center';
  ctx.fillText('CHINATOWN MARKET',480,70);

  // awnings and storefronts
  for(const stall of stalls){
    ctx.fillStyle='#1a1d23';ctx.fillRect(stall.x,stall.y,stall.w,56);
    ctx.fillStyle='#d2b48c';ctx.fillRect(stall.x,stall.y,stall.w,3);
    ctx.font='900 13px system-ui';ctx.fillStyle='#f7d36b';ctx.textAlign='center';ctx.fillText(stall.title,stall.x+stall.w/2,stall.y+24);
    ctx.fillStyle='#6c2020';ctx.fillRect(stall.x+12,stall.y+31,stall.w-24,17);
    ctx.fillStyle='#f0c15e';ctx.fillRect(stall.x+22,stall.y+34,10,10);ctx.fillRect(stall.x+45,stall.y+34,10,10);
  }

  // market tables / baskets
  for(let i=0;i<10;i++){
    const x=20+i*95;
    ctx.fillStyle='#4a3127';ctx.fillRect(x,470,62,7);
    ctx.fillStyle=i%2?'#c64b39':'#d39c54';ctx.beginPath();ctx.arc(x+16,463,10,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#6d9b5a';ctx.beginPath();ctx.arc(x+38,460,9,0,Math.PI*2);ctx.fill();
  }
}

function drawPlatform(p){
  ctx.fillStyle=p.kind==='street'?'#292b31':'#4a3025';
  ctx.fillRect(p.x,p.y,p.w,p.h);
  ctx.fillStyle=p.kind==='street'?'#484b52':'#b2673b';
  ctx.fillRect(p.x,p.y,p.w,5);
  ctx.fillStyle='rgba(255,255,255,.05)';
  for(let xx=p.x+8;xx<p.x+p.w;xx+=24)ctx.fillRect(xx,p.y+8,12,4);
}

function drawLadder(l){
  ctx.fillStyle='#9e6a39';ctx.fillRect(l.x,l.topY,l.w,Math.max(0,l.bottomY-l.topY));
  ctx.fillStyle='#d7a66a';ctx.fillRect(l.x+2,l.topY,5,Math.max(0,l.bottomY-l.topY));
  ctx.fillRect(l.x+l.w-7,l.topY,5,Math.max(0,l.bottomY-l.topY));
  for(let y=l.topY+7;y<l.bottomY;y+=13)ctx.fillRect(l.x+2,y,l.w-4,4);
}

function draw(){
  ctx.save();
  ctx.translate(0,camY);

  drawMarket();
  for(const p of platforms) drawPlatform(p);
  for(const l of ladders) drawLadder(l);

  // Signboards
  const signs=[
    {x:36,y:396,w:110,t:'TEA HOUSE'},{x:278,y:337,w:112,t:'BAO & BUN'},
    {x:495,y:272,w:115,t:'SPICE SHOP'},{x:735,y:212,w:128,t:'NIGHT MARKET'},
    {x:584,y:142,w:112,t:'FISH STALL'},{x:330,y:87,w:120,t:'TAKEAWAY'},
    {x:77,y:27,w:120,t:'DRAGON BAR'}
  ];
  for(const s of signs){
    ctx.fillStyle='#2d2020';ctx.fillRect(s.x,s.y,s.w,28);
    ctx.strokeStyle='#c98a43';ctx.strokeRect(s.x,s.y,s.w,28);
    ctx.fillStyle='#f6d170';ctx.font='900 11px system-ui';ctx.textAlign='center';ctx.fillText(s.t,s.x+s.w/2,s.y+19);
  }

  // Enemies
  for(const e of enemies){
    drawHuman(e.x,e.y,0.88,'#3b82a3','#263448','#d7a27d','#241a16',e.vx>=0?1:-1);
  }

  // Player
  if(player.inv%10<7) drawHuman(player.x,player.y,0.98,'#c93d3d','#2f3440','#d6a17b','#1d1513',player.face);

  // flying knees
  for(const s of shots){
    ctx.save();ctx.translate(s.x,s.y);ctx.rotate(s.rot);
    ctx.fillStyle='#dba077';
    ctx.beginPath();ctx.ellipse(0,0,14,10,0,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#b46f4a';ctx.fillRect(-12,6,20,5);
    ctx.fillStyle='#171717';ctx.fillRect(-4,-3,3,3);ctx.fillRect(4,-3,3,3);
    ctx.restore();
  }

  for(const pt of particles){
    ctx.globalAlpha=Math.max(0,pt.life/42);ctx.fillStyle=pt.col;ctx.fillRect(pt.x,pt.y,4,4);ctx.globalAlpha=1;
  }

  ctx.restore();

  // HUD stays fixed
  ctx.fillStyle='rgba(0,0,0,.55)';ctx.fillRect(10,10,300,72);
  ctx.fillStyle='#fff';ctx.textAlign='left';ctx.font='900 20px system-ui';
  ctx.fillText('BEN, AND HIS CHINESE KNEES',20,36);
  ctx.font='700 15px system-ui';ctx.fillText('Score: '+score+'   Lives: '+('♥'.repeat(lives)),20,59);
  ctx.fillStyle='#f2cf6a';ctx.fillText('CLIMB TO THE TOP • 1800 PTS',20,78);

  // Ladder instruction
  if(nearestLadder()){
    ctx.textAlign='center';ctx.font='700 15px system-ui';ctx.fillStyle='#fff';
    ctx.fillText('JUMP/UP = CLIMB   DOWN = DESCEND',480,525);
  }

  if(state!=='play'){
    ctx.fillStyle='rgba(0,0,0,.74)';ctx.fillRect(0,0,W,H);
    ctx.textAlign='center';
    ctx.fillStyle=state==='win'?'#f5d372':'#ff7777';
    ctx.font='900 54px system-ui';
    ctx.fillText(state==='win'?'MARKET CLEARED!':'KNEE\\'D OUT!',480,240);
    ctx.fillStyle='#fff';ctx.font='700 21px system-ui';
    ctx.fillText('Tap KNEE or press R to restart',480,285);
  }
}

function loop(){update();draw();requestAnimationFrame(loop)}
reset();loop();
</script>
</body>
</html>
